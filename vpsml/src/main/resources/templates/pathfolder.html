<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Files · VPS Manager</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-head"><div><span class="eyebrow">FILE MANAGER</span><h1 th:text="${path}">/</h1><p class="muted" th:text="${host}"></p></div><a class="btn" th:href="@{/internal/path(path=${parentPath})}">↑ Parent</a></div><div th:if="${error}" class="alert danger" th:text="${error}"></div><section class="panel"><div class="panel-head"><h2>Upload</h2><form th:action="@{/files/upload}" method="post" enctype="multipart/form-data" class="inline"><input type="hidden" name="path" th:value="${path}"><input type="file" name="file" required><button class="btn primary">Upload</button></form></div></section><section class="file-grid"><a class="file-card" th:each="folder : ${folders}" th:href="@{/files(path=${path == '/' ? '/' + folder : path + '/' + folder})}"><span class="icon">📁</span><b th:text="${folder}"></b><small>Directory</small></a><div class="file-card" th:each="file : ${files}"><span class="icon">📄</span><b th:text="${file}"></b><small>File</small><a class="btn tiny" th:href="@{/files/download(path=${path == '/' ? '/' + file : path + '/' + file})}">Download</a></div></section></main></body></html>
