<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VPS Manager · Connect</title><link rel="stylesheet" href="/css/app.css"></head><body class="login-bg"><main class="login-card"><div class="brand"><span class="brand-dot"></span> VPS<span>Manager</span></div><h1>Connect to Linux VPS</h1><p class="muted">Secure SSH connection for server administration.</p><div th:if="${error}" class="alert danger" th:text="${error}"></div><form th:action="@{/connect}" th:object="${vpsloginform}" method="post"><label>Host / IP<input th:field="*{host}" placeholder="190.92.175.39" autocomplete="off"><small th:errors="*{host}"></small></label><div class="grid2"><label>SSH Port<input type="number" th:field="*{port}" min="1" max="65535"></label><label>Username<input th:field="*{username}" placeholder="root"></label></div><label>Password<input type="password" th:field="*{password}" autocomplete="off"></label><label>Starting Path<input th:field="*{path}" placeholder="/"></label><button class="btn primary wide">Connect securely →</button></form><p class="hint">Credentials are kept in the server-side session and are not saved to the database.</p></main></body></html>
