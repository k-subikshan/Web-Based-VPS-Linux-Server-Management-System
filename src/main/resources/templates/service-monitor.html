<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Services · VPS Manager</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-head"><div><span class="eyebrow">SYSTEMD</span><h1>Service Manager</h1></div></div><div th:if="${error}" class="alert danger" th:text="${error}"></div><div th:if="${message}" class="alert success" th:text="${message}"></div><div class="service-grid large"><div class="service panel" th:each="entry : ${services}"><div class="panel-head"><b th:text="${entry.key}"></b><span th:text="${entry.value}" th:classappend="${entry.value == 'active'} ? ' status online' : ' status offline'"></span></div><div class="actions"><form th:action="@{/service-monitor/action}" method="post"><input type="hidden" name="service" th:value="${entry.key}"><input type="hidden" name="action" value="start"><button class="btn tiny">Start</button></form><form th:action="@{/service-monitor/action}" method="post"><input type="hidden" name="service" th:value="${entry.key}"><input type="hidden" name="action" value="restart"><button class="btn tiny">Restart</button></form><form th:action="@{/service-monitor/action}" method="post"><input type="hidden" name="service" th:value="${entry.key}"><input type="hidden" name="action" value="stop"><button class="btn tiny danger">Stop</button></form></div></div></div></main></body></html>
