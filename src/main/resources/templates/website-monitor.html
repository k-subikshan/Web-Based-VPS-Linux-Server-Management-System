<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Monitor · VPS Manager</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-head"><div><span class="eyebrow">UPTIME & TLS</span><h1>Website Monitor</h1></div></div><form th:action="@{/website-monitor/check}" method="post" class="panel inline"><input name="website" th:value="${website}" placeholder="https://example.com" required><button class="btn primary">Check</button></form><div th:if="${error}" class="alert danger" th:text="${error}"></div><div th:if="${result}" class="metric-grid"><div class="metric"><span>HTTP Status</span><strong th:text="${result.status}"></strong></div><div class="metric"><span>Response</span><strong th:text="${result.responseTime + ' ms'}"></strong></div><div class="metric"><span>Availability</span><strong th:text="${result.online ? 'ONLINE' : 'OFFLINE'}"></strong></div><div class="metric"><span>TLS</span><strong th:text="${sslDays != null ? sslDays + ' days' : 'N/A'}"></strong></div></div></main></body></html>
