<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logs · VPS Manager</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-head"><div><span class="eyebrow">LOG ANALYZER</span><h1>Server Logs</h1></div></div><form class="filter panel" method="get"><select name="source"><option value="nginx" th:selected="${source=='nginx'}">Nginx</option><option value="auth" th:selected="${source=='auth'}">SSH/Auth</option><option value="mysql" th:selected="${source=='mysql'}">MySQL</option><option value="mariadb" th:selected="${source=='mariadb'}">MariaDB</option><option value="gunicorn" th:selected="${source=='gunicorn'}">Gunicorn</option><option value="springboot" th:selected="${source=='springboot'}">Spring Boot</option></select><input name="lines" type="number" min="10" max="500" th:value="${lines}"><button class="btn primary">Load</button></form><div th:if="${error}" class="alert danger" th:text="${error}"></div><pre class="logbox" th:text="${logs}"></pre></main></body></html>
