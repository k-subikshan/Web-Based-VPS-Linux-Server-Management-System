<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projects · VPS Manager</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-head"><div><span class="eyebrow">DEPLOYMENTS</span><h1>Projects</h1></div></div><form th:action="@{/projects}" method="post" class="panel grid2"><label>Project name<input name="name" required></label><label>Path<input name="path" placeholder="/var/www/app"></label><label>Status<select name="status"><option>DEPLOYED</option><option>UNDEPLOYED</option></select></label><div><button class="btn primary">Add project</button></div></form><section class="panel"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Path</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="p:${projects}"><td th:text="${p.projectName}"></td><td th:text="${p.projectPath}"></td><td th:text="${p.status}"></td><td><form th:action="@{/projects/delete}" method="post"><input type="hidden" name="id" th:value="${p.id}"><button class="btn tiny danger">Delete</button></form></td></tr></tbody></table></div></section></main></body></html>
