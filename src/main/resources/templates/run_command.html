<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminal · VPS Manager</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-head"><div><span class="eyebrow">REMOTE TERMINAL</span><h1>Linux Command Console</h1><p class="muted">Working directory: <code th:text="${path}"></code></p></div></div><section class="terminal"><form th:action="@{/run_command}" method="post"><div class="terminal-input"><span>$</span><input name="command" th:value="${command}" autofocus placeholder="ls -la"><button class="btn primary">Run</button></div></form><pre class="terminal-output" th:text="${output != null ? output : 'Output will appear here…'}"></pre></section><div class="alert warning">Safety policy blocks destructive commands, privilege escalation, remote downloaders and other high-risk patterns.</div></main></body></html>
