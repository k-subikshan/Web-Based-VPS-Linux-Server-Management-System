<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="30"><title>Monitor · VPS Manager</title><link rel="stylesheet" href="/css/app.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><div class="page-head"><div><span class="eyebrow">REAL-TIME HEALTH</span><h1>Server Monitor</h1><p class="muted" th:text="${host + ':' + port}"></p></div><span class="status online">● Connected</span></div><div th:if="${error}" class="alert danger" th:text="${error}"></div><div class="metric-grid"><div class="metric"><span>CPU</span><strong th:text="${cpu + '%'}"></strong><div class="bar"><i th:style="'width:' + ${cpu} + '%' "></i></div></div><div class="metric"><span>RAM</span><strong th:text="${ram + '%'}"></strong><div class="bar"><i th:style="'width:' + ${ram} + '%' "></i></div></div><div class="metric"><span>Disk</span><strong th:text="${disk + '%'}"></strong><div class="bar"><i th:style="'width:' + ${disk} + '%' "></i></div></div><div class="metric"><span>Network</span><strong th:text="${network + ' MB'}"></strong><small>Total RX + TX since boot</small></div></div><section class="panel"><div class="panel-head"><h2>System</h2><span class="muted" th:text="${uptime}"></span></div><p>Load average: <b th:text="${load}"></b></p></section><section class="panel"><div class="panel-head"><h2>Services</h2><a href="/service-monitor" class="btn">Manage</a></div><div class="service-grid"><div class="service" th:each="entry : ${services}"><b th:text="${entry.key}"></b><span th:text="${entry.value}" th:classappend="${entry.value == 'active'} ? ' status online' : ' status offline'"></span></div></div></section></main></body></html>
