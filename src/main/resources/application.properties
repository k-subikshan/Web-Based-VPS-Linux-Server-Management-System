spring.application.name=linux-server-management
server.port=${SERVER_PORT:8080}
server.servlet.session.timeout=30m

# Default profile uses an embedded H2 database so the application starts without
# requiring a local MySQL password. Set SPRING_PROFILES_ACTIVE=mysql to use MySQL.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SSH defaults
vps.ssh.connect-timeout-ms=${VPS_SSH_TIMEOUT:10000}
vps.ssh.command-timeout-ms=${VPS_COMMAND_TIMEOUT:30000}
vps.ssh.strict-host-key-checking=${VPS_STRICT_HOST_KEY_CHECKING:no}
